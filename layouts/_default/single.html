{{ define "main" }}
<article class="page-shell">
  <header class="page-header">
    <p class="eyebrow">Our West Valley AZ</p>
    <h1>{{ .Title }}</h1>

    {{ with .Description }}
      <p class="page-description">{{ . }}</p>
    {{ end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
